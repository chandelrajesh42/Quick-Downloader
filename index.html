    <!-- JAVASCRIPT LOGIC ENGINE (Multi-Server Fix) -->
    <script>
        const DIRECT_LINK_AD_URL = "https://your-direct-link-ad-url.com";

        function openPlatform(url) {
            document.getElementById('platformFrame').src = url;
            document.getElementById('platformModal').classList.remove('hidden');
            document.getElementById('platformModal').classList.add('flex');
        }

        function closePlatform() {
            document.getElementById('platformModal').classList.add('hidden');
            document.getElementById('platformModal').classList.remove('flex');
            document.getElementById('platformFrame').src = "";
        }

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    document.getElementById('mediaUrl').value = text;
                }
            } catch (err) {
                alert('Please allow clipboard permission or paste manually.');
            }
        }

        async function processMedia() {
            const urlInput = document.getElementById('mediaUrl').value.trim();
            const format = document.querySelector('input[name="format"]:checked').value;
            const loadingArea = document.getElementById('loadingArea');
            const resultArea = document.getElementById('resultArea');
            const statusText = document.getElementById('statusText');
            const btnFetch = document.getElementById('btnFetch');

            if (!urlInput) {
                alert('Please paste a video or audio link first!');
                return;
            }

            btnFetch.disabled = true;
            btnFetch.classList.add('opacity-50');
            loadingArea.classList.remove('hidden');
            resultArea.classList.add('hidden');

            statusText.innerText = "Processing video stream...";

            // Multi-Server Fallback Engine
            const apiServers = [
                "https://co.wuk.sh/api/json",
                "https://cobalt-api.kityune.workers.dev/",
                "https://api.cobalt.tools/api/json"
            ];

            let success = false;

            for (let server of apiServers) {
                try {
                    statusText.innerText = "Connecting to fast server...";
                    const response = await fetch(server, {
                        method: "POST",
                        headers: {
                            "Accept": "application/json",
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            url: urlInput,
                            isAudioOnly: (format === "mp3")
                        })
                    });

                    const data = await response.json();

                    if (data && (data.url || data.picker)) {
                        const finalUrl = data.url || (data.picker && data.picker[0] ? data.picker[0].url : null);
                        if (finalUrl) {
                            setTimeout(() => {
                                loadingArea.classList.add('hidden');
                                resultArea.classList.remove('hidden');
                                document.getElementById('downloadBtn').href = finalUrl;
                                btnFetch.disabled = false;
                                btnFetch.classList.remove('opacity-50');
                            }, 1500);
                            success = true;
                            break;
                        }
                    }
                } catch (e) {
                    console.log("Retrying next server...");
                }
            }

            // Rapid Engine Backup (Instagram/FB Fix)
            if (!success) {
                try {
                    statusText.innerText = "Extracting media files...";
                    const backupRes = await fetch(`https://api.vkrdown.com/v1/main?url=${encodeURIComponent(urlInput)}`);
                    const backupData = await backupRes.json();
                    
                    if (backupData && backupData.data && backupData.data.downloadUrl) {
                        setTimeout(() => {
                            loadingArea.classList.add('hidden');
                            resultArea.classList.remove('hidden');
                            document.getElementById('downloadBtn').href = backupData.data.downloadUrl;
                            btnFetch.disabled = false;
                            btnFetch.classList.remove('opacity-50');
                        }, 1500);
                        success = true;
                    }
                } catch(err) {
                    console.log("Backup failed too");
                }
            }

            if (!success) {
                loadingArea.classList.add('hidden');
                btnFetch.disabled = false;
                btnFetch.classList.remove('opacity-50');
                alert("This media is private or link is invalid. Please try a public YouTube/Instagram video link.");
            }
        }

        function triggerAd() {
            if (DIRECT_LINK_AD_URL && DIRECT_LINK_AD_URL !== "https://your-direct-link-ad-url.com") {
                window.open(DIRECT_LINK_AD_URL, '_blank');
            }
        }
    </script>
