<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Downloader - Fast HD Video & MP3 Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border-top-color: #3b82f6;
            animation: spinner 1s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">

    <!-- HEADER -->
    <header class="p-4 bg-slate-900 border-b border-slate-800 text-center flex flex-col items-center justify-center gap-1 shadow-md">
        <div class="flex items-center gap-2">
            <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
            </svg>
            <h1 class="text-2xl font-black text-blue-500 tracking-wider">Quick Downloader</h1>
        </div>
        <p class="text-xs text-slate-400">Fast & Free Video & MP3 Downloader</p>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-xl w-full mx-auto p-5 sm:p-6 bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 my-auto">
        
        <!-- Platform Access -->
        <div class="mb-5 text-center">
            <p class="text-xs text-slate-400 mb-2 font-medium">Browse Platforms:</p>
            <div class="flex justify-center items-center gap-2 sm:gap-3 flex-wrap">
                <a href="https://m.facebook.com/" target="_blank" class="p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-slate-300">📘 Facebook</a>
                <a href="https://www.instagram.com/" target="_blank" class="p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-slate-300">📸 Instagram</a>
                <a href="https://m.youtube.com/" target="_blank" class="p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-slate-300">🔴 YouTube</a>
                <a href="https://x.com/" target="_blank" class="p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-slate-300">🐦 X (Twitter)</a>
            </div>
        </div>

        <!-- INPUT FIELD -->
        <div class="space-y-4">
            <div class="relative flex items-center">
                <input type="url" id="mediaUrl" placeholder="Paste Video / Reel link here..." 
                    class="w-full p-4 pr-24 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm focus:outline-none focus:border-blue-500">
                <button onclick="pasteFromClipboard()" class="absolute right-2 bg-slate-800 text-blue-400 text-xs px-3 py-2 rounded-lg font-medium border border-slate-700">
                    📋 Paste
                </button>
            </div>

            <!-- FORMAT SELECTION -->
            <div class="grid grid-cols-2 gap-3">
                <label class="flex items-center justify-center p-3.5 rounded-xl border border-slate-800 bg-slate-950 cursor-pointer">
                    <input type="radio" name="format" value="mp4" checked class="mr-2 accent-blue-500">
                    <span class="text-sm font-semibold text-slate-200">🎬 Video (MP4)</span>
                </label>
                <label class="flex items-center justify-center p-3.5 rounded-xl border border-slate-800 bg-slate-950 cursor-pointer">
                    <input type="radio" name="format" value="mp3" class="mr-2 accent-blue-500">
                    <span class="text-sm font-semibold text-slate-200">🎵 Audio (MP3)</span>
                </label>
            </div>

            <!-- FETCH BUTTON -->
            <button onclick="processMedia()" id="btnFetch" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-blue-600/25">
                ⚡ Fetch Download Link
            </button>
        </div>

        <!-- LOADING -->
        <div id="loadingArea" class="hidden mt-6 text-center">
            <div class="loader rounded-full border-4 border-slate-800 border-t-4 h-9 w-9 mx-auto mb-2"></div>
            <p id="statusText" class="text-xs text-blue-400 font-medium animate-pulse">Fetching media & thumbnail...</p>
        </div>

        <!-- RESULT & PREVIEW AREA -->
        <div id="resultArea" class="hidden mt-6 p-4 bg-slate-950 border border-slate-800 rounded-xl text-center">
            
            <!-- Media Thumbnail Photo -->
            <div class="w-full max-h-60 rounded-lg overflow-hidden mb-4 bg-slate-900 border border-slate-800 flex items-center justify-center">
                <img id="previewImg" src="" alt="Thumbnail" class="w-full object-cover max-h-60">
            </div>

            <p id="mediaTitle" class="text-xs text-slate-300 font-medium mb-3 truncate">Media Extracted</p>

            <!-- Direct Download Button -->
            <button id="directDownloadBtn" onclick="downloadFileDirectly()" 
                class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 px-6 rounded-xl transition shadow-lg text-sm">
                ⬇️ DIRECT DOWNLOAD FILE
            </button>
        </div>
    </main>

    <footer class="p-4 bg-slate-900 border-t border-slate-800 text-center text-xs text-slate-500">
        © 2026 Quick Downloader.
    </footer>

    <!-- JS ENGINE -->
    <script>
        let rawStreamUrl = "";

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) document.getElementById('mediaUrl').value = text;
            } catch (err) {
                alert('Please paste the URL manually.');
            }
        }

        async function processMedia() {
            const urlInput = document.getElementById('mediaUrl').value.trim();
            const format = document.querySelector('input[name="format"]:checked').value;
            const loadingArea = document.getElementById('loadingArea');
            const resultArea = document.getElementById('resultArea');
            const btnFetch = document.getElementById('btnFetch');
            const previewImg = document.getElementById('previewImg');
            const mediaTitle = document.getElementById('mediaTitle');

            if (!urlInput) {
                alert('Please paste a link first!');
                return;
            }

            btnFetch.disabled = true;
            btnFetch.classList.add('opacity-50');
            loadingArea.classList.remove('hidden');
            resultArea.classList.add('hidden');

            try {
                // High Quality Media API Call
                const response = await fetch("https://co.wuk.sh/api/json", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        url: urlInput,
                        isAudioOnly: (format === "mp3")
                    })
                });

                const data = await response.json();

                if (data && data.url) {
                    rawStreamUrl = data.url;

                    // Fetch Image Thumbnail via Proxy to Bypass CORS
                    const encodedThumb = encodeURIComponent(data.thumb || `https://images.weserv.nl/?url=${encodeURIComponent(urlInput)}`);
                    previewImg.src = `https://images.weserv.nl/?url=${encodedThumb}`;
                    
                    mediaTitle.innerText = data.text || "Media File Ready";
                } else {
                    alert("Failed to fetch direct download link. Try another link.");
                }
            } catch (err) {
                alert("Error fetching media stream. Check network connection.");
            }

            loadingArea.classList.add('hidden');
            resultArea.classList.remove('hidden');
            btnFetch.disabled = false;
            btnFetch.classList.remove('opacity-50');
        }

        // Direct Device Blob Download (No App/Browser Redirect)
        async function downloadFileDirectly() {
            if (!rawStreamUrl) return;

            const dlBtn = document.getElementById('directDownloadBtn');
            const format = document.querySelector('input[name="format"]:checked').value;
            
            dlBtn.innerText = "⏳ Downloading to device...";
            dlBtn.disabled = true;

            try {
                const response = await fetch(rawStreamUrl);
                const blob = await response.blob();
                
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = `media_file_${Date.now()}.${format}`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);

                dlBtn.innerText = "✓ DOWNLOAD COMPLETE";
            } catch (error) {
                // Fallback to force direct file trigger
                window.location.href = rawStreamUrl;
                dlBtn.innerText = "⬇️ DIRECT DOWNLOAD FILE";
            }
            
            setTimeout(() => {
                dlBtn.disabled = false;
                dlBtn.innerText = "⬇️ DIRECT DOWNLOAD FILE";
            }, 3000);
        }
    </script>
</body>
</html>
