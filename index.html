<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quick Downloader - HD Video & MP3 Downloader</title><script src="https://cdn.tailwindcss.com"></script><style>
    .loader {
        border-top-color: #3b82f6;
        animation: spin .8s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .download-btn:disabled {
        opacity: .5;
        cursor: not-allowed;
    }
</style></head><body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans"><!-- HEADER --><header class="p-4 bg-slate-900 border-b border-slate-800 text-center shadow-md">
    <div class="flex items-center justify-center gap-2">    <svg class="w-8 h-8 text-blue-500"
         fill="none"
         stroke="currentColor"
         viewBox="0 0 24 24">

        <path stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4">
        </path>

    </svg>

    <h1 class="text-2xl font-black text-blue-500 tracking-wider">
        Quick Downloader
    </h1>

</div>

<p class="text-xs text-slate-400 mt-1">
    Fast & Free Video & MP3 Downloader
</p>

</header><!-- TOP AD --><div class="w-full text-center my-3 px-2"><div class="inline-block w-full max-w-[728px]
            p-3 bg-slate-900
            border border-slate-800
            rounded-lg text-xs text-slate-600">

    [ Top Responsive Banner Ad ]

</div>

</div><!-- MAIN --><main class="max-w-xl w-full mx-auto
            p-5 sm:p-6
            bg-slate-900
            rounded-2xl
            shadow-2xl
            border border-slate-800
            my-auto"><!-- PLATFORMS -->
<div class="mb-5 text-center">

    <p class="text-xs text-slate-400 mb-2 font-medium">
        Supported Platforms:
    </p>

    <div class="flex justify-center items-center gap-2 flex-wrap">

        <span class="p-2.5 bg-slate-800
                     border border-slate-700
                     rounded-xl text-xs text-slate-300">
            📘 Facebook
        </span>

        <span class="p-2.5 bg-slate-800
                     border border-slate-700
                     rounded-xl text-xs text-slate-300">
            📸 Instagram
        </span>

        <span class="p-2.5 bg-slate-800
                     border border-slate-700
                     rounded-xl text-xs text-slate-300">
            🔴 YouTube
        </span>

        <span class="p-2.5 bg-slate-800
                     border border-slate-700
                     rounded-xl text-xs text-slate-300">
            🐦 X
        </span>

    </div>

</div>


<!-- URL -->
<div class="space-y-4">

    <div class="relative flex items-center">

        <input
            type="url"
            id="mediaUrl"
            autocomplete="off"
            placeholder="Paste Video / Reel / Short URL..."
            class="w-full p-4 pr-24
                   rounded-xl
                   bg-slate-950
                   border border-slate-800
                   text-white text-sm
                   focus:outline-none
                   focus:border-blue-500
                   placeholder-slate-500">

        <button
            type="button"
            id="pasteBtn"
            class="absolute right-2
                   bg-slate-800
                   hover:bg-slate-700
                   text-blue-400
                   text-xs px-3 py-2
                   rounded-lg
                   font-medium
                   border border-slate-700">

            📋 Paste

        </button>

    </div>


    <!-- FORMAT -->
    <div class="grid grid-cols-2 gap-3">

        <label class="flex items-center justify-center
                      p-3.5 rounded-xl
                      border border-slate-800
                      bg-slate-950
                      cursor-pointer
                      hover:border-blue-500">

            <input
                type="radio"
                name="format"
                value="mp4"
                checked
                class="mr-2 accent-blue-500">

            <span class="text-sm font-semibold">
                🎬 Video (MP4)
            </span>

        </label>


        <label class="flex items-center justify-center
                      p-3.5 rounded-xl
                      border border-slate-800
                      bg-slate-950
                      cursor-pointer
                      hover:border-blue-500">

            <input
                type="radio"
                name="format"
                value="mp3"
                class="mr-2 accent-blue-500">

            <span class="text-sm font-semibold">
                🎵 Audio (MP3)
            </span>

        </label>

    </div>


    <!-- FETCH -->
    <button
        id="fetchBtn"
        type="button"
        class="w-full
               bg-blue-600
               hover:bg-blue-500
               active:scale-[.99]
               text-white
               font-bold
               py-4
               rounded-xl
               transition
               shadow-lg
               shadow-blue-600/25">

        ⚡ Fetch Download Link

    </button>

</div>


<!-- LOADING -->
<div id="loading"
     class="hidden mt-6 text-center">

    <div class="loader
                rounded-full
                border-4
                border-slate-800
                border-t-4
                h-9 w-9
                mx-auto mb-2">
    </div>

    <p id="loadingText"
       class="text-xs text-blue-400 font-medium">

        Checking URL...

    </p>

</div>


<!-- ERROR -->
<div id="errorBox"
     class="hidden mt-6
            p-4
            rounded-xl
            border border-red-900
            bg-red-950/30
            text-center">

    <p id="errorText"
       class="text-sm text-red-300">
    </p>

</div>


<!-- RESULT -->
<div id="result"
     class="hidden mt-6
            p-4
            bg-slate-950
            border border-slate-800
            rounded-xl
            text-center
            space-y-3">


    <div class="w-full
                max-h-64
                rounded-lg
                overflow-hidden
                bg-slate-900
                border border-slate-800
                flex items-center justify-center">

        <div class="p-8 text-slate-500
                    text-xs">

            🎬

            <br>

            Media Ready

        </div>

    </div>


    <p id="title"
       class="text-xs text-slate-300 font-medium truncate">

        Media ready for download

    </p>


    <button
        id="downloadBtn"
        type="button"
        disabled
        class="download-btn
               w-full
               bg-emerald-500
               hover:bg-emerald-400
               text-slate-950
               font-black
               py-3.5
               px-6
               rounded-xl
               transition
               shadow-lg
               text-sm">

        ⬇️ DOWNLOAD FILE

    </button>

</div>

</main><!-- BOTTOM AD --><div class="w-full text-center my-3 px-2"><div class="inline-block
            w-[300px]
            h-[250px]
            p-4
            bg-slate-900
            border border-slate-800
            rounded-xl
            text-xs
            text-slate-600
            flex items-center justify-center">

    [ Mobile Banner Ad ]

</div>

</div><!-- FOOTER --><footer class="p-4
               bg-slate-900
               border-t border-slate-800
               text-center
               text-xs
               text-slate-500">© 2026 Quick Downloader. All rights reserved.

</footer><script>

const mediaUrl = document.getElementById("mediaUrl");
const fetchBtn = document.getElementById("fetchBtn");
const downloadBtn = document.getElementById("downloadBtn");
const pasteBtn = document.getElementById("pasteBtn");

const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");

const errorBox = document.getElementById("errorBox");
const errorText = document.getElementById("errorText");

const result = document.getElementById("result");
const title = document.getElementById("title");


/* -------------------------
   PASTE
------------------------- */

pasteBtn.addEventListener("click", async () => {

    try {

        const text =
            await navigator.clipboard.readText();

        if (text) {
            mediaUrl.value = text.trim();
        }

    } catch {

        alert(
            "Clipboard permission unavailable. Please paste the URL manually."
        );

    }

});


/* -------------------------
   HELPERS
------------------------- */

function showError(message) {

    errorText.textContent = message;

    errorBox.classList.remove("hidden");

}

function hideError() {

    errorBox.classList.add("hidden");

    errorText.textContent = "";

}

function validURL(value) {

    try {

        const url = new URL(value);

        return (
            url.protocol === "http:" ||
            url.protocol === "https:"
        );

    } catch {

        return false;

    }

}

function setLoading(state, message) {

    if (state) {

        loading.classList.remove("hidden");

        loadingText.textContent = message;

        fetchBtn.disabled = true;

        fetchBtn.classList.add("opacity-50");

    } else {

        loading.classList.add("hidden");

        fetchBtn.disabled = false;

        fetchBtn.classList.remove("opacity-50");

    }

}


/* -------------------------
   FETCH
------------------------- */

fetchBtn.addEventListener("click", async () => {

    hideError();

    result.classList.add("hidden");

    downloadBtn.disabled = true;

    const url =
        mediaUrl.value.trim();

    const format =
        document.querySelector(
            'input[name="format"]:checked'
        ).value;


    if (!url) {

        showError(
            "Please paste a video URL first."
        );

        return;

    }


    if (!validURL(url)) {

        showError(
            "Please enter a valid HTTP/HTTPS URL."
        );

        return;

    }


    setLoading(
        true,
        "Checking media URL..."
    );


    try {

        /*
         * IMPORTANT:
         *
         * This endpoint expects a DIRECT
         * media-file URL.
         *
         * A normal YouTube/Instagram/etc.
         * webpage URL is not a direct file.
         */

        const response =
            await fetch(url, {
                method: "HEAD",
                redirect: "follow"
            });


        if (!response.ok) {

            throw new Error(
                "The media server rejected this URL."
            );

        }


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        if (
            contentType.includes("text/html")
        ) {

            throw new Error(
                "This is a webpage URL, not a direct media file URL."
            );

        }


        let extension = "mp4";

        if (
            contentType.includes("audio") ||
            format === "mp3"
        ) {

            extension = "mp3";

        }


        const filename =
            "quick-downloader-" +
            Date.now() +
            "." +
            extension;


        title.textContent =
            "Media ready for download";


        downloadBtn.disabled = false;


        downloadBtn.onclick = () => {

            const anchor =
                document.createElement("a");

            anchor.href = url;

            anchor.download = filename;

            anchor.target = "_blank";

            anchor.rel = "noopener";

            document.body.appendChild(anchor);

            anchor.click();

            anchor.remove();

        };


        result.classList.remove("hidden");


    } catch (error) {

        showError(
            error.message ||
            "Unable to access this media."
        );

    } finally {

        setLoading(false);

    }

});


/* -------------------------
   ENTER KEY
------------------------- */

mediaUrl.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            fetchBtn.click();
        }

    }
);

</script></body>
</html>
