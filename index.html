<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Downloader - Full HD Video & MP3 Downloader</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border-top-color: #3b82f6;
            animation: spinner 0.8s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">

    <!-- HEADER -->
    <header class="p-4 bg-slate-900 border-b border-slate-800 text-center shadow-md">
        <h1 class="text-2xl font-black text-blue-500 tracking-wider">Quick Downloader</h1>
        <p class="text-xs text-slate-400">Universal Video & MP3 Downloader Engine</p>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-md w-full mx-auto p-5 bg-slate-900 rounded-2xl border border-slate-800 my-auto shadow-2xl">
        
        <!-- Platform Icons -->
        <div class="mb-4 text-center">
            <p class="text-xs text-slate-400 mb-2 font-medium">Supported Platforms:</p>
            <div class="flex justify-center items-center gap-2 flex-wrap">
                <span class="px-2.5 py-1 bg-slate-800 border border-slate-700 text-xs rounded-lg text-slate-300">🔴 YouTube</span>
                <span class="px-2.5 py-1 bg-slate-800 border border-slate-700 text-xs rounded-lg text-slate-300">📸 Instagram</span>
                <span class="px-2.5 py-1 bg-slate-800 border border-slate-700 text-xs rounded-lg text-slate-300">📘 Facebook</span>
                <span class="px-2.5 py-1 bg-slate-800 border border-slate-700 text-xs rounded-lg text-slate-300">🐦 Twitter / X</span>
            </div>
        </div>

        <!-- URL INPUT SECTION -->
        <div class="space-y-3">
            <div class="relative flex items-center">
                <input type="url" id="mediaUrl" placeholder="Paste Video / Reel / Short URL here..." 
                    class="w-full p-3.5 pr-20 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm focus:outline-none focus:border-blue-500">
                <button onclick="pasteFromClipboard()" class="absolute right-2 bg-slate-800 hover:bg-slate-700 text-blue-400 text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition">
                    📋 Paste
                </button>
            </div>

            <!-- FORMAT SELECTION -->
            <div class="grid grid-cols-2 gap-3">
                <label class="flex items-center justify-center p-3 rounded-xl border border-slate-800 bg-slate-950 cursor-pointer hover:border-blue-500">
                    <input type="radio" name="format" value="mp4" checked class="mr-2 accent-blue-500">
                    <span class="text-xs font-bold text-slate-200">🎬 Video (MP4)</span>
                </label>
                <label class="flex items-center justify-center p-3 rounded-xl border border-slate-800 bg-slate-950 cursor-pointer hover:border-blue-500">
                    <input type="radio" name="format" value="mp3" class="mr-2 accent-blue-500">
                    <span class="text-xs font-bold text-slate-200">🎵 Audio (MP3)</span>
                </label>
            </div>

            <!-- FETCH & DOWNLOAD BUTTON -->
            <button onclick="processAndDownload()" id="btnDownload" 
                class="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-sm">
                ⚡ Direct Download File
            </button>
        </div>

        <!-- LOADING AREA -->
        <div id="loadingArea" class="hidden mt-5 text-center">
            <div class="loader rounded-full border-4 border-slate-800 h-8 w-8 mx-auto mb-2"></div>
            <p id="statusText" class="text-xs text-blue-400 font-medium animate-pulse">Processing media link...</p>
        </div>

        <!-- MEDIA RESULT CARD -->
        <div id="resultArea" class="hidden mt-5 p-4 bg-slate-950 border border-slate-800 rounded-xl text-center space-y-3">
            <div id="thumbBox" class="w-full max-h-48 rounded-lg overflow-hidden bg-slate-900 border border-slate-800 flex items-center justify-center">
                <img id="previewImg" src="" alt="Preview" class="w-full object-cover max-h-48 hidden">
                <div id="thumbFallback" class="p-4 text-slate-500 text-xs flex flex-col items-center">
                    <span class="text-2xl">🎬</span>
                    <span>Media Ready</span>
                </div>
            </div>
            <p id="mediaTitle" class="text-xs text-slate-300 font-medium truncate">Direct Media Stream Extracted</p>
            
            <a id="finalDownloadBtn" href="#" target="_blank" download
                class="block w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3 rounded-xl transition text-sm">
                ⬇️ START DIRECT FILE DOWNLOAD
            </a>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="p-4 bg-slate-900 border-t border-slate-800 text-center text-xs text-slate-500">
        © 2026 Quick Downloader. All rights reserved.
    </footer>

    <!-- ENGINE SCRIPT -->
    <script>
        // Monetag / Adsterra Direct Link Ad URL (Optional)
        const DIRECT_LINK_AD_URL = ""; 

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) document.getElementById('mediaUrl').value = text;
            } catch (err) {
                alert('Please paste the URL manually.');
            }
        }

        async function processAndDownload() {
            const urlInput = document.getElementById('mediaUrl').value.trim();
            const format = document.querySelector('input[name="format"]:checked').value;

            const btnDownload = document.getElementById('btnDownload');
            const loadingArea = document.getElementById('loadingArea');
            const statusText = document.getElementById('statusText');
            const resultArea = document.getElementById('resultArea');
            const previewImg = document.getElementById('previewImg');
            const thumbFallback = document.getElementById('thumbFallback');
            const mediaTitle = document.getElementById('mediaTitle');
            const finalDownloadBtn = document.getElementById('finalDownloadBtn');

            if (!urlInput) {
                alert('Please paste a valid video or reel link first!');
                return;
            }

            // Open Direct Link Ad if configured
            if (DIRECT_LINK_AD_URL && DIRECT_LINK_AD_URL.trim() !== "") {
                window.open(DIRECT_LINK_AD_URL, '_blank');
            }

            btnDownload.disabled = true;
            btnDownload.classList.add('opacity-50');
            loadingArea.classList.remove('hidden');
            resultArea.classList.add('hidden');
            previewImg.classList.add('hidden');
            thumbFallback.classList.remove('hidden');
            statusText.innerText = "Connecting to extractor engine...";

            let extractedUrl = "";
            let thumbnailUrl = "";
            let videoTitle = "QuickDownloader_Media";

            // --- PRIMARY ENGINE (VKR Worker) ---
            try {
                const res = await fetch(`https://api.vkrdownloader.workers.dev/?url=${encodeURIComponent(urlInput)}`);
                const data = await res.json();
                
                if (data && data.data) {
                    if (format === 'mp3' && data.data.audioUrl) {
                        extractedUrl = data.data.audioUrl;
                    } else if (data.data.downloadUrl) {
                        extractedUrl = data.data.downloadUrl;
                    } else if (data.data.downloads && data.data.downloads.length > 0) {
                        extractedUrl = data.data.downloads[0].url;
                    }
                    if (data.data.thumbnail) thumbnailUrl = data.data.thumbnail;
                    if (data.data.title) videoTitle = data.data.title;
                }
            } catch (e) {
                console.log("Primary Engine Failed, switching to Secondary...");
            }

            // --- SECONDARY ENGINE (Cobalt Instances) ---
            if (!extractedUrl) {
                const instances = ["https://cobalt.api.scld.tech", "https://co.wuk.sh"];
                for (let instance of instances) {
                    try {
                        const res = await fetch(`${instance}/api/json`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json", "Accept": "application/json" },
                            body: JSON.stringify({ 
                                url: urlInput, 
                                isAudioOnly: (format === "mp3"),
                                aBitrate: "320",
                                vQuality: "720"
                            })
                        });
                        const data = await res.json();
                        if (data && data.url) {
                            extractedUrl = data.url;
                            if (data.thumb) thumbnailUrl = data.thumb;
                            if (data.text) videoTitle = data.text;
                            break;
                        }
                    } catch (err) { continue; }
                }
            }

            // UI UPDATE & FILE LINK ASSIGNMENT
            if (extractedUrl) {
                mediaTitle.innerText = videoTitle;
                finalDownloadBtn.href = extractedUrl;
                
                if (thumbnailUrl) {
                    previewImg.src = "https://images.weserv.nl/?url=" + encodeURIComponent(thumbnailUrl);
                    previewImg.classList.remove('hidden');
                    thumbFallback.classList.add('hidden');
                }

                loadingArea.classList.add('hidden');
                resultArea.classList.remove('hidden');
            } else {
                alert('Stream extract nahi ho pa rahi. Please check link ya 2 min baad try karein.');
                loadingArea.classList.add('hidden');
            }

            btnDownload.disabled = false;
            btnDownload.classList.remove('opacity-50');
        }
    </script>
</body>
</html>
