<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Downloader - Fast HD Video & MP3 Downloader</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border-top-color: #3b82f6;
            animation: spinner 1s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">

    <!-- NAVBAR HEADER -->
    <header class="p-4 bg-slate-900 border-b border-slate-800 text-center flex flex-col items-center justify-center gap-1 shadow-md">
        <div class="flex items-center gap-2">
            <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
            </svg>
            <h1 class="text-2xl font-black text-blue-500 tracking-wider">Quick Downloader</h1>
        </div>
        <p class="text-xs text-slate-400">Fast & Free Video & MP3 Downloader</p>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-xl w-full mx-auto p-5 sm:p-6 bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 my-auto">
        
        <!-- Platform Access Buttons -->
        <div class="mb-5 text-center">
            <p class="text-xs text-slate-400 mb-2 font-medium">Browse & Access Platforms:</p>
            <div class="flex justify-center items-center gap-2 sm:gap-3 flex-wrap">
                <a href="https://m.facebook.com/" target="_blank" rel="noopener noreferrer" class="p-2.5 bg-slate-800 hover:bg-blue-600/20 border border-slate-700 rounded-xl transition flex items-center gap-1.5 text-xs text-slate-300">
                    📘 Facebook
                </a>
                <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" class="p-2.5 bg-slate-800 hover:bg-pink-600/20 border border-slate-700 rounded-xl transition flex items-center gap-1.5 text-xs text-slate-300">
                    📸 Instagram
                </a>
                <a href="https://m.youtube.com/" target="_blank" rel="noopener noreferrer" class="p-2.5 bg-slate-800 hover:bg-red-600/20 border border-slate-700 rounded-xl transition flex items-center gap-1.5 text-xs text-slate-300">
                    🔴 YouTube
                </a>
                <a href="https://x.com/" target="_blank" rel="noopener noreferrer" class="p-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl transition flex items-center gap-1.5 text-xs text-slate-300">
                    🐦 X (Twitter)
                </a>
            </div>
        </div>

        <!-- URL INPUT FIELD -->
        <div class="space-y-4">
            <div class="relative flex items-center">
                <input type="url" id="mediaUrl" placeholder="Paste Video / Reel link here..." 
                    class="w-full p-4 pr-24 rounded-xl bg-slate-950 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 text-sm">
                <button onclick="pasteFromClipboard()" class="absolute right-2 bg-slate-800 hover:bg-slate-700 text-blue-400 text-xs px-3 py-2 rounded-lg font-medium border border-slate-700 transition">
                    📋 Paste
                </button>
            </div>

            <!-- FORMAT SELECTION -->
            <div class="grid grid-cols-2 gap-3">
                <label class="flex items-center justify-center p-3.5 rounded-xl border border-slate-800 bg-slate-950 cursor-pointer hover:border-blue-500 transition">
                    <input type="radio" name="format" value="mp4" checked class="mr-2 accent-blue-500">
                    <span class="text-sm font-semibold text-slate-200">🎬 Video (MP4)</span>
                </label>
                <label class="flex items-center justify-center p-3.5 rounded-xl border border-slate-800 bg-slate-950 cursor-pointer hover:border-blue-500 transition">
                    <input type="radio" name="format" value="mp3" class="mr-2 accent-blue-500">
                    <span class="text-sm font-semibold text-slate-200">🎵 Audio (MP3)</span>
                </label>
            </div>

            <!-- FETCH BUTTON -->
            <button onclick="processMedia()" id="btnFetch" 
                class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white font-bold py-4 rounded-xl transition duration-150 shadow-lg shadow-blue-600/25">
                ⚡ Fetch Download Link
            </button>
        </div>

        <!-- LOADING ANIMATION -->
        <div id="loadingArea" class="hidden mt-6 text-center">
            <div class="loader rounded-full border-4 border-slate-800 border-t-4 h-9 w-9 mx-auto mb-2"></div>
            <p id="statusText" class="text-xs text-blue-400 font-medium animate-pulse">Fetching media info...</p>
        </div>

        <!-- RESULT & PREVIEW AREA -->
        <div id="resultArea" class="hidden mt-6 p-4 bg-slate-950 border border-slate-800 rounded-xl text-center">
            <!-- 1. Media Preview Photo -->
            <div class="relative w-full max-h-60 rounded-lg overflow-hidden mb-4 bg-slate-900 flex items-center justify-center border border-slate-800">
                <img id="previewImg" src="" alt="Media Preview" class="w-full object-cover max-h-60 hidden">
                <div id="noImgFallback" class="p-6 text-xs text-slate-500 flex flex-col items-center gap-1">
                    <span class="text-2xl">🖼️</span>
                    <span>Media Ready</span>
                </div>
            </div>

            <p id="mediaTitle" class="text-xs text-slate-300 font-medium mb-3 truncate">Ready for download</p>

            <!-- 2. Direct Download Button (No external page redirect) -->
            <button id="directDownloadBtn" onclick="triggerDirectDownload()" 
                class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 px-6 rounded-xl transition shadow-lg shadow-emerald-500/20 text-sm tracking-wide">
                ⬇️ DOWNLOAD NOW
            </button>
        </div>
    </main>

    <footer class="p-4 bg-slate-900 border-t border-slate-800 text-center text-xs text-slate-500">
        © 2026 Quick Downloader.
    </footer>

    <!-- JAVASCRIPT ENGINE -->
    <script>
        let finalDownloadUrl = "";

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) document.getElementById('mediaUrl').value = text;
            } catch (err) {
                alert('Please paste the URL manually.');
            }
        }

        async function processMedia() {
            const urlInput = document.getElementById('mediaUrl').value.trim();
            const format = document.querySelector('input[name="format"]:checked').value;
            const loadingArea = document.getElementById('loadingArea');
            const resultArea = document.getElementById('resultArea');
            const btnFetch = document.getElementById('btnFetch');
            const previewImg = document.getElementById('previewImg');
            const noImgFallback = document.getElementById('noImgFallback');
            const mediaTitle = document.getElementById('mediaTitle');

            if (!urlInput) {
                alert('Please paste a link first!');
                return;
            }

            btnFetch.disabled = true;
            btnFetch.classList.add('opacity-50');
            loadingArea.classList.remove('hidden');
            resultArea.classList.add('hidden');

            try {
                // Fetch details directly via API Engine
                const response = await fetch("https://co.wuk.sh/api/json", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        url: urlInput,
                        isAudioOnly: (format === "mp3")
                    })
                });

                const data = await response.json();

                if (data && data.url) {
                    finalDownloadUrl = data.url;
                    
                    // Show Thumbnail Photo if available
                    if (data.picker && data.picker[0] && data.picker[0].thumb) {
                        previewImg.src = data.picker[0].thumb;
                        previewImg.classList.remove('hidden');
                        noImgFallback.classList.add('hidden');
                    } else if (data.thumb) {
                        previewImg.src = data.thumb;
                        previewImg.classList.remove('hidden');
                        noImgFallback.classList.add('hidden');
                    } else {
                        previewImg.classList.add('hidden');
                        noImgFallback.classList.remove('hidden');
                    }

                    if (data.text) {
                        mediaTitle.innerText = data.text;
                    }
                } else {
                    // Fallback direct stream link
                    finalDownloadUrl = urlInput;
                    previewImg.classList.add('hidden');
                    noImgFallback.classList.remove('hidden');
                }
            } catch (err) {
                finalDownloadUrl = urlInput;
                previewImg.classList.add('hidden');
                noImgFallback.classList.remove('hidden');
            }

            loadingArea.classList.add('hidden');
            resultArea.classList.remove('hidden');
            btnFetch.disabled = false;
            btnFetch.classList.remove('opacity-50');
        }

        // Direct Download handler (Prevents opening external website pages)
        function triggerDirectDownload() {
            if (!finalDownloadUrl) return;

            const format = document.querySelector('input[name="format"]:checked').value;
            const a = document.createElement('a');
            a.href = finalDownloadUrl;
            a.download = `downloaded_media.${format}`;
            a.target = '_self'; // Opens download stream directly without opening new tab/page
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
